name: Build & Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: 解析版本号
        id: meta
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(sed -n 's/^version="\(.*\)"/\1/p' fpk/manifest | head -n1)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "版本号：${VERSION}"

      - name: 静态检查与测试
        run: |
          cd src
          go vet ./...
          go test ./...

      - name: 同步 manifest 版本号
        run: |
          sed -i "s|^version=.*|version=\"${{ steps.meta.outputs.version }}\"|" fpk/manifest
          grep -E '^version' fpk/manifest

      - name: 图标路径版本化（绕开 fnOS 前端图标缓存）
        run: |
          # fnOS 桌面/应用中心按图标文件路径缓存，路径不变换了图也显示旧图。
          # 用版本号生成新文件名并改写 ui/config，让缓存 key 自然失效。
          ICON_TAG="$(printf '%s' "${{ steps.meta.outputs.version }}" | sed 's/[^0-9A-Za-z]/_/g')"
          # 清掉历史版本的图标，避免旧图一起进包
          rm -f fpk/app/ui/images/icon_v*_64.png fpk/app/ui/images/icon_v*_256.png
          for sz in 64 256; do
            cp -f "fpk/app/ui/images/icon_${sz}.png" "fpk/app/ui/images/icon_v${ICON_TAG}_${sz}.png"
          done
          sed -i -E "s#\"icon\": *\"images/[^\"]*\"#\"icon\": \"images/icon_v${ICON_TAG}_{0}.png\"#" fpk/app/ui/config
          grep -n '"icon"' fpk/app/ui/config
          ls -l fpk/app/ui/images/

      - name: 交叉编译（linux/amd64 + arm64 + armv6 静态二进制）
        run: |
          mkdir -p fpk/app/bin dist
          for GOARCH in amd64 arm64 arm; do
            GOARM_ARG=""
            [ "$GOARCH" = "arm" ] && GOARM_ARG="GOARM=6"
            echo "==> linux/${GOARCH}${GOARM_ARG:+ ($GOARM_ARG)}"
            env CGO_ENABLED=0 GOOS=linux GOARCH="${GOARCH}" ${GOARM_ARG} \
              go build -C src -trimpath \
              -ldflags "-s -w -X main.version=${{ steps.meta.outputs.version }}" \
              -o "$PWD/fpk/app/bin/fngate-${GOARCH}" .
          done
          chmod +x fpk/app/bin/fngate-* fpk/cmd/*
          ls -lh fpk/app/bin/
          file fpk/app/bin/* || true

      - name: 下载 fnpack
        run: |
          curl -fsSL -o /usr/local/bin/fnpack \
            https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64
          chmod +x /usr/local/bin/fnpack
          fnpack --help | head -5

      - name: 打包 .fpk
        run: |
          fnpack build -d fpk
          python3 scripts/fix_fpk_perms.py fngate.fpk
          VERSION="${{ steps.meta.outputs.version }}"
          mv fngate.fpk "dist/fngate-${VERSION}.fpk"
          echo "=== 产物结构 ==="
          tar -tvzf "dist/fngate-${VERSION}.fpk" | head -30
          ls -lh dist/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: fngate-fpk
          path: dist/*.fpk

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.fpk
          generate_release_notes: true
          body: |
            ## 路由网关 · fnGate v${{ steps.meta.outputs.version }}

            **原生应用（无需 Docker）**：安装包内已包含 amd64 / arm64 / arm 三份静态编译的可执行文件，
            安装时不联网、不拉取任何镜像。

            ### 功能
            - 路由端口转发：UPnP IGD 发现、映射增删、路由器重启后自动补发
            - 反向代理：入口 + 路由双层模型，HTTP / HTTPS / TCP，域名与路径路由，SNI 证书
            - 证书管理：飞牛系统证书只读导入、手动上传、ACME DNS-01 泛域名申请、自动续期

            ### 安装
            飞牛「应用中心 → 设置 → 手动安装」上传本页的 `.fpk` 文件即可。
            装好后从桌面图标打开（走飞牛统一网关，不占用管理端口）。

            ### 前置条件
            - 路由器需开启 UPnP（端口转发功能）
            - 绑定 80 / 443 需要应用启动时授予 cap_net_bind_service（脚本自动处理）
            - 申请泛域名证书需要对应 DNS 服务商的 API 凭据，或使用手动 TXT 验证
