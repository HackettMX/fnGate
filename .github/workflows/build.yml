name: Build & Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: 解析版本号
        id: meta
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(sed -n 's/^version="\(.*\)"/\1/p' fpk/manifest | head -n1)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "版本号：${VERSION}"

      - name: 静态检查与测试
        run: |
          cd src
          go vet ./...
          go test ./...

      - name: 同步 manifest 版本号
        run: |
          sed -i "s|^version=.*|version=\"${{ steps.meta.outputs.version }}\"|" fpk/manifest
          grep -E '^version' fpk/manifest

      - name: 图标路径版本化（绕开 fnOS 前端图标缓存）
        run: |
          # fnOS 桌面/应用中心按图标文件路径缓存，路径不变换了图也显示旧图。
          # 用版本号生成新文件名并改写 ui/config，让缓存 key 自然失效。
          ICON_TAG="$(printf '%s' "${{ steps.meta.outputs.version }}" | sed 's/[^0-9A-Za-z]/_/g')"
          # 清掉历史版本的图标，避免旧图一起进包
          rm -f fpk/app/ui/images/icon_v*_64.png fpk/app/ui/images/icon_v*_256.png
          for sz in 64 256; do
            cp -f "fpk/app/ui/images/icon_${sz}.png" "fpk/app/ui/images/icon_v${ICON_TAG}_${sz}.png"
          done
          sed -i -E "s#\"icon\": *\"images/[^\"]*\"#\"icon\": \"images/icon_v${ICON_TAG}_{0}.png\"#" fpk/app/ui/config
          grep -n '"icon"' fpk/app/ui/config
          ls -l fpk/app/ui/images/

      - name: 交叉编译（linux/amd64 + arm64 + armv6 静态二进制）
        run: |
          mkdir -p fpk/app/bin dist
          for GOARCH in amd64 arm64 arm; do
            GOARM_ARG=""
            [ "$GOARCH" = "arm" ] && GOARM_ARG="GOARM=6"
            echo "==> linux/${GOARCH}${GOARM_ARG:+ ($GOARM_ARG)}"
            env CGO_ENABLED=0 GOOS=linux GOARCH="${GOARCH}" ${GOARM_ARG} \
              go build -C src -trimpath \
              -ldflags "-s -w -X main.version=${{ steps.meta.outputs.version }}" \
              -o "$PWD/fpk/app/bin/fngate-${GOARCH}" .
          done
          chmod +x fpk/app/bin/fngate-* fpk/cmd/*
          ls -lh fpk/app/bin/
          file fpk/app/bin/* || true

      - name: 下载 fnpack
        run: |
          curl -fsSL -o /usr/local/bin/fnpack \
            https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64
          chmod +x /usr/local/bin/fnpack
          fnpack --help | head -5

      - name: 打包 .fpk
        run: |
          fnpack build -d fpk
          python3 scripts/fix_fpk_perms.py fngate.fpk
          VERSION="${{ steps.meta.outputs.version }}"
          mv fngate.fpk "dist/fngate-${VERSION}.fpk"
          echo "=== 产物结构 ==="
          tar -tvzf "dist/fngate-${VERSION}.fpk" | head -30
          ls -lh dist/

      - name: 生成校验和
        run: |
          cd dist
          sha256sum ./*.fpk > checksums.txt
          cat checksums.txt

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: fngate-fpk
          path: |
            dist/*.fpk
            dist/checksums.txt

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.fpk
            dist/checksums.txt
          fail_on_unmatched_files: true
          body: |
            ## 路由网关 · fnGate v${{ steps.meta.outputs.version }}

            **原生应用，不需要 Docker。** 安装包里已含 amd64 / arm64 / armv6 三份静态编译的可执行文件，
            安装与运行全程不联网、不拉任何镜像。

            ### 本版变更

            **1.2.13**
            - 修复「确认同步后提示『已有部署任务正在运行，请稍后重试』」：部署会重启飞牛服务，通常 20–60 秒，此前主应用到部署守护的请求 **120 秒就超时**——界面报错、守护却仍在执行，用户再点一下就被 `BUSY` 挡住。现在部署请求给到 5 分钟，界面在同步期间显示「同步中…」并禁止重复提交。
            - 打开同步窗口时若上一次仍在执行，直接显示**当前阶段**（更新证书元数据 / 写入证书文件 / 重启飞牛服务 / 验证本机 HTTPS / 复核一致性）与**已运行秒数**，并每 3 秒轮询，结束后自动刷新。
            - 「正在运行」不再只有一句无信息量的话：说明卡在哪个阶段、已跑多久；超过 5 分钟会提示可能是飞牛服务重启卡住，并给出「停用再启用 fnGate」的处理办法。

            **1.2.12**
            - 修复「预检通过、点确认同步却提示『系统证书或配置已变化，请重新预检』」：预检生成的计划现在保留在部署服务内，确认后**直接执行这份计划**，不再重新计算一遍再比对哈希——重新计算会把文件读取的时序差异误判成冲突。
            - 冲突提示改为逐项事实：哪个证书文件在预检后被改写（字节数对比）、权限/属主怎么变、网关配置变化多少字节、证书行哪几个字段被改动；不再只给一句「配置已变化」。
            - 二次校验与数据库 CAS 命中失败时**不再触发回滚**（这两个阶段还没写入任何内容，回滚反而会把外部改动覆盖回去），直接放弃本次计划。

            **1.2.11**
            - 修复「证书已导入、路径检查也通过，但仍被跳过」：root 部署引擎不再按整文件严格匹配 PEM，改为按 PEM 块解析，容忍 UTF-8 BOM、openssl 的 `Bag Attributes` 前缀、证书文件里混入私钥块、链顺序为「CA 在前」以及 DER 编码的 `.crt`。
            - 解析失败时直接给出出问题的环节与事实：证书文件字节数、PEM 块类型清单、被忽略的非 PEM 文本、叶子证书与私钥的配对结果、私钥算法与位数、有效期区间。
            - 链按「叶子 → 签发者」重排后再写回，保证 nginx 收到的证书顺序正确；带 IP/URI 类型 SAN 的证书不再被整张拒绝。

            **1.2.10**
            - 修复「已导入证书仍是 0 个可替换目标」：证书路径的安全检查不再因为**组写位**或**目录/文件属主是 fnOS 服务账号**（如 `www-data`、`0775 root:trim`）而拒绝，只有「其他用户可写」才算不安全；证书路径解析软链后仍必须在证书根目录内。
            - 每张被跳过的证书现在给出逐项事实：路径是否存在、是否软链接、权限与属主、硬链接数、是否在证书根目录下、索引条目是否匹配、网关是否绑定该证书。
            - 端口默认值改为 `5667`（fnOS 默认 HTTPS），并优先回填该目标证书**已验证通过**的端口；预检失败时会说明是「连不上端口」「指纹不一致」还是「证书不受信任」，不再只提示「HTTPS 验证未通过」。
            - 回滚仍然安全，但失败原因现在会一并显示，不再只剩「已恢复原证书」。

            **1.2.9**
            - 修复部分 fnOS 版本上「同步到飞牛」显示「无可用目标」：root 部署引擎对齐飞牛数据库字段的弱类型（数字 `id`、数组/JSON 格式 `san`、字符串时间戳），此前这些字段会让所有证书行被 fail-closed 校验全部跳过。
            - 证书页现在直接列出每张被跳过的系统证书及其具体原因（来源、域名、有效期单位、文件路径、索引条目匹配数），不再只显示「0 个可用目标」。
            - 新增「复制诊断信息」：一键复制脱敏后的真机诊断文本，便于定位 fnOS 版本差异。

            **1.2.8**
            - 证书管理方向反转：移除旧的「飞牛系统证书只读导入」，证书库现在只管理本应用申请、上传或自签的证书。
            - 新增「同步到飞牛系统 HTTPS」：选择一张证书推送替换飞牛里手动导入的同域名证书，带预检、备份、失败回滚、TLS 指纹与信任验证，并显示每张证书的同步状态。
            - 手动成功部署一次后可开启「续期后自动重新同步」：ACME 续期成功后自动用新证书再次替换并验证。
            - 系统写入由独立的 root 侧受限守护通过本地 Unix Socket 执行，主应用降权运行、不接触系统路径。

            **1.2.7**
            - 反向代理修复 WebSocket 握手返回 `502`：状态码记录层吞掉了 `Hijacker`，导致协议切换失败；现已透传 `Hijacker` / `Flusher` / `Pusher` / `ReaderFrom`。
            - 转发失败提示区分「连不上后端」与「后端已连上但转发失败」，不再把协议错误误导成网络问题。
            - 新增 WebSocket 端到端回归测试（101 握手 + 帧透传）。

            **1.2.6**
            - 路由转发：内部 IP 填了非本机地址时，明确说明「路由器通常只允许映射到本机」，并在提交前二次确认；给出反向代理中转与路由器手动转发两条可行路径。
            - 本机 IP 检测改为枚举真实网卡（排除回环/链路本地/fake-ip 段），修复 Clash/Surge fake-ip 模式下显示 `198.18.x.x` 的问题。

            **1.2.5**
            - 路由转发兼容挑剔固件：添加映射遇到 `402 Invalid Args` 时自动降级参数重试
              （`RemoteHost="*"`、有限租期），并在错误里保留路由器的原始描述，方便定位。
            - 添加映射失败时错误直接显示在弹窗内，不再重复弹出 toast。

            **1.2.4**
            - 证书库新增「导出」：把 `fullchain.pem`、`privkey.pem` 和一份导入说明打包成 ZIP，
              用于把申请的证书导入飞牛系统或其它设备。
            - 导出需二次确认，走 `POST` + CSRF Token，响应 `Cache-Control: no-store`；没有本机私钥的证书直接拒绝，不给残缺包。

            **1.2.3**
            - 修复 `*.example.com` 这类泛域名签发时 CA 报 `No TXT record found`：当 `_acme-challenge`
              被 `*` 通配记录 CNAME 指向主域名时，现在**查 DNS 服务商记录接口**判断 CNAME
              （不再依赖本机 DNS，规避 NAS 上 fake-ip 代理的干扰），把 TXT 写到 CNAME 目标名。
            - 订单日志新增 `TXT 落点` 一行，失败时可直接看出记录写到了哪个名字。

            **1.2.2**
            - 名称统一：路由转发、域名解析、证书申请。
            - 原「网络 → 域名解析」的解析查询与体检并入「证书 → 域名解析」。

            ### 功能一览

            | 模块 | 能力 |
            | --- | --- |
            | 路由转发 | UPnP IGD 自动发现、映射增删、路由器重启后补发 |
            | 反向代理 | 入口 + 路由双层模型，HTTP / HTTPS / TCP，域名与路径路由，SNI 证书，健康检查 |
            | 证书管理 | 证书库、手动上传、自签、到期提醒、一键同步到飞牛系统 HTTPS |
            | 证书申请 | ACME DNS-01 泛域名申请、自动续期、多家 DNS 服务商、续期后自动同步到飞牛 |
            | 域名解析 | 多 DNS 并排查询、一键体检（NS 委派 / SOA / apex NS / fake-ip 检测） |

            ### 安装

            1. 下载本页下方的 `fngate-${{ steps.meta.outputs.version }}.fpk`
            2. 飞牛「应用中心 → 设置 → 手动安装」，上传该文件
            3. 从桌面图标打开（走飞牛统一网关，不占用管理端口）

            ### 前置条件

            - 端口转发需要路由器开启 UPnP
            - 绑定 80 / 443 需要 `cap_net_bind_service`（安装脚本自动授予）
            - 申请证书需要对应 DNS 服务商的 API 凭据，或用手动 TXT 验证

            ### 校验

            安装包 SHA256 见下方附件旁的 `checksums.txt`。

            ---
            完整说明与排错手册见 [README](https://github.com/${{ github.repository }}#readme)。
