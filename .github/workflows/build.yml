name: Build & Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: 解析版本号
        id: meta
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(sed -n 's/^version="\(.*\)"/\1/p' fpk/manifest | head -n1)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "版本号：${VERSION}"

      - name: 静态检查与测试
        run: |
          cd src
          go vet ./...
          go test ./...

      - name: 同步 manifest 版本号
        run: |
          sed -i "s|^version=.*|version=\"${{ steps.meta.outputs.version }}\"|" fpk/manifest
          grep -E '^version' fpk/manifest

      - name: 图标路径版本化（绕开 fnOS 前端图标缓存）
        run: |
          # fnOS 桌面/应用中心按图标文件路径缓存，路径不变换了图也显示旧图。
          # 用版本号生成新文件名并改写 ui/config，让缓存 key 自然失效。
          ICON_TAG="$(printf '%s' "${{ steps.meta.outputs.version }}" | sed 's/[^0-9A-Za-z]/_/g')"
          # 清掉历史版本的图标，避免旧图一起进包
          rm -f fpk/app/ui/images/icon_v*_64.png fpk/app/ui/images/icon_v*_256.png
          for sz in 64 256; do
            cp -f "fpk/app/ui/images/icon_${sz}.png" "fpk/app/ui/images/icon_v${ICON_TAG}_${sz}.png"
          done
          sed -i -E "s#\"icon\": *\"images/[^\"]*\"#\"icon\": \"images/icon_v${ICON_TAG}_{0}.png\"#" fpk/app/ui/config
          grep -n '"icon"' fpk/app/ui/config
          ls -l fpk/app/ui/images/

      - name: 交叉编译（linux/amd64 + arm64 + armv6 静态二进制）
        run: |
          mkdir -p fpk/app/bin dist
          for GOARCH in amd64 arm64 arm; do
            GOARM_ARG=""
            [ "$GOARCH" = "arm" ] && GOARM_ARG="GOARM=6"
            echo "==> linux/${GOARCH}${GOARM_ARG:+ ($GOARM_ARG)}"
            env CGO_ENABLED=0 GOOS=linux GOARCH="${GOARCH}" ${GOARM_ARG} \
              go build -C src -trimpath \
              -ldflags "-s -w -X main.version=${{ steps.meta.outputs.version }}" \
              -o "$PWD/fpk/app/bin/fngate-${GOARCH}" .
          done
          chmod +x fpk/app/bin/fngate-* fpk/cmd/*
          ls -lh fpk/app/bin/
          file fpk/app/bin/* || true

      - name: 下载 fnpack
        run: |
          curl -fsSL -o /usr/local/bin/fnpack \
            https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64
          chmod +x /usr/local/bin/fnpack
          fnpack --help | head -5

      - name: 打包 .fpk
        run: |
          fnpack build -d fpk
          python3 scripts/fix_fpk_perms.py fngate.fpk
          VERSION="${{ steps.meta.outputs.version }}"
          mv fngate.fpk "dist/fngate-${VERSION}.fpk"
          echo "=== 产物结构 ==="
          tar -tvzf "dist/fngate-${VERSION}.fpk" | head -30
          ls -lh dist/

      - name: 生成校验和
        run: |
          cd dist
          sha256sum ./*.fpk > checksums.txt
          cat checksums.txt

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: fngate-fpk
          path: |
            dist/*.fpk
            dist/checksums.txt

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.fpk
            dist/checksums.txt
          fail_on_unmatched_files: true
          body: |
            ## 路由网关 · fnGate v${{ steps.meta.outputs.version }}

            **原生应用，不需要 Docker。** 安装包里已含 amd64 / arm64 / armv6 三份静态编译的可执行文件，
            安装与运行全程不联网、不拉任何镜像。

            ### 本版变更

            **1.2.17**
            - **移除飞牛证书导入**（`--cert-sync`）：证书库只管理本应用申请、上传、自签的证书，不再读取任何飞牛系统证书目录；证书数据仍只保存在应用私有目录。
            - **移除「解析查询 / 域名体检」**：DNS 页面收敛为服务商凭据管理，签发链路与自动续期不受影响。
            - **界面重构**：更简洁的统计卡片与表格，统一的弹窗与状态标签；**适配移动端**（抽屉式菜单、表格自动卡片化、底部弹出表单）。
            - **代码质量修复**：定时任务 panic 不再静默吞掉（记录日志与事件）；移除有竞态的死代码 EventBus 订阅机制；修复反代连接池与 TCP 转发的 goroutine 泄漏；补齐 HTTP 超时；修正日志脱敏与配置备份的错误响应。

            **1.2.16**
            - **移除「同步到飞牛系统 HTTPS」功能**，证书管理回到 1.2.7 的行为：申请、自动续期、上传、导出证书包、从飞牛导入。
            - 不再安装或运行任何 root 守护进程，不写入飞牛证书目录与证书数据库，**不再重启 `network_service` / `trim_nginx`**。
            - 升级后首次启动会自动结束旧版遗留的部署守护进程，并清理它的 socket 与 PID 文件；不触碰系统证书与系统服务。
            - 本版可执行文件与 1.2.7 等价，仅版本号提升，用于覆盖已安装的 1.2.8–1.2.15。

            **1.2.7**
            - 反向代理修复 WebSocket 握手返回 `502`：状态码记录层吞掉了 `Hijacker`，导致协议切换失败；现已透传 `Hijacker` / `Flusher` / `Pusher` / `ReaderFrom`。
            - 转发失败提示区分「连不上后端」与「后端已连上但转发失败」，不再把协议错误误导成网络问题。
            - 新增 WebSocket 端到端回归测试（101 握手 + 帧透传）。

            **1.2.6**
            - 路由转发：内部 IP 填了非本机地址时，明确说明「路由器通常只允许映射到本机」，并在提交前二次确认；给出反向代理中转与路由器手动转发两条可行路径。
            - 本机 IP 检测改为枚举真实网卡（排除回环/链路本地/fake-ip 段），修复 Clash/Surge fake-ip 模式下显示 `198.18.x.x` 的问题。

            **1.2.5**
            - 路由转发兼容挑剔固件：添加映射遇到 `402 Invalid Args` 时自动降级参数重试
              （`RemoteHost="*"`、有限租期），并在错误里保留路由器的原始描述，方便定位。
            - 添加映射失败时错误直接显示在弹窗内，不再重复弹出 toast。

            **1.2.4**
            - 证书库新增「导出」：把 `fullchain.pem`、`privkey.pem` 和一份导入说明打包成 ZIP，
              用于把申请的证书导入飞牛系统或其它设备。
            - 导出需二次确认，走 `POST` + CSRF Token，响应 `Cache-Control: no-store`；没有本机私钥的证书直接拒绝，不给残缺包。

            **1.2.3**
            - 修复 `*.example.com` 这类泛域名签发时 CA 报 `No TXT record found`：当 `_acme-challenge`
              被 `*` 通配记录 CNAME 指向主域名时，现在**查 DNS 服务商记录接口**判断 CNAME
              （不再依赖本机 DNS，规避 NAS 上 fake-ip 代理的干扰），把 TXT 写到 CNAME 目标名。
            - 订单日志新增 `TXT 落点` 一行，失败时可直接看出记录写到了哪个名字。

            **1.2.2**
            - 名称统一：路由转发、域名解析、证书申请。
            - 原「网络 → 域名解析」的解析查询与体检并入「证书 → 域名解析」。

            ### 功能一览

            | 模块 | 能力 |
            | --- | --- |
            | 路由转发 | UPnP IGD 自动发现、映射增删、路由器重启后补发 |
            | 反向代理 | 入口 + 路由双层模型，HTTP / HTTPS / TCP，域名与路径路由，SNI 证书，健康检查 |
            | 证书管理 | 证书库、飞牛系统证书只读导入、手动上传、到期提醒 |
            | 证书申请 | ACME DNS-01 泛域名申请、自动续期、多家 DNS 服务商 |
            | 域名解析 | 多 DNS 并排查询、一键体检（NS 委派 / SOA / apex NS / fake-ip 检测） |

            ### 安装

            1. 下载本页下方的 `fngate-${{ steps.meta.outputs.version }}.fpk`
            2. 飞牛「应用中心 → 设置 → 手动安装」，上传该文件
            3. 从桌面图标打开（走飞牛统一网关，不占用管理端口）

            ### 前置条件

            - 端口转发需要路由器开启 UPnP
            - 绑定 80 / 443 需要 `cap_net_bind_service`（安装脚本自动授予）
            - 申请证书需要对应 DNS 服务商的 API 凭据，或用手动 TXT 验证

            ### 校验

            安装包 SHA256 见下方附件旁的 `checksums.txt`。

            ---
            完整说明与排错手册见 [README](https://github.com/${{ github.repository }}#readme)。
